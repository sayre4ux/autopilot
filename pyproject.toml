description = "Test harness for the deterministic Autopilot components."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
