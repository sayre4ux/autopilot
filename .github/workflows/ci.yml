name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -v

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # DECISION: pin the Claude Code build the mod was written and tested against; the mods API is early access.
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin test .
