title: Autopilot
description: Multi-agent orchestration plugin for Claude Code
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  strip_title: false
color_scheme: dark
search_enabled: true
aux_links:
  GitHub: https://github.com/sayre4ux/autopilot
footer_content: "MIT licensed · <a href=\"https://github.com/sayre4ux/autopilot\">sayre4ux/autopilot</a>"
exclude:
  - diagrams/*.archify.json
defaults:
  - scope: { path: "index.md" }
    values: { nav_order: 1, title: Home }
  - scope: { path: "install.md" }
    values: { nav_order: 2 }
  - scope: { path: "how-it-works.md" }
    values: { nav_order: 3 }
  - scope: { path: "workers.md" }
    values: { nav_order: 4 }
  - scope: { path: "enforcement.md" }
    values: { nav_order: 5 }
  - scope: { path: "review.md" }
    values: { nav_order: 6 }
  - scope: { path: "super-engineering.md" }
    values: { nav_order: 7 }
  - scope: { path: "design.md" }
    values: { nav_order: 8 }
